<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000px" height="900px" viewBox="0 0 1000 900">
    <style>
        .state { rx: 8; ry: 8; stroke: #333; stroke-width: 2; fill-opacity: 0.95; }
        .state-logic { fill: #E3F2FD; } /* Light Blue */
        .state-io { fill: #FFFDE7; } /* Light Yellow */
        .state-ok { fill: #E8F5E9; } /* Light Green */
        .state-fail { fill: #FFEBEE; } /* Light Red */
        .state-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
        .transition-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; text-anchor: middle; }
        .arrow-head { fill: #333; }
        .line { stroke: #333; stroke-width: 1.5; }
    </style>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
        </marker>
    </defs>

    <g id="title">
      <text x="500" y="30" font-size="20" font-weight="bold" text-anchor="middle">FB_HomeEOT Internal State Machine</text>
    </g>

    <!-- States -->
    <g id="states">
        <rect id="st_idle" x="400" y="60" width="200" height="60" class="state state-io"/>
        <text x="500" y="90" class="state-text">HE_IDLE</text>

        <rect id="st_check" x="400" y="170" width="200" height="60" class="state state-logic"/>
        <text x="500" y="200" class="state-text">HE_CHECK_REQ</text>
        
        <rect id="st_fast" x="400" y="280" width="200" height="60" class="state state-logic"/>
        <text x="500" y="310" class="state-text">HE_FAST_APPROACH</text>
        
        <rect id="st_slow" x="400" y="390" width="200" height="60" class="state state-logic"/>
        <text x="500" y="420" class="state-text">HE_SLOW_APPROACH</text>
        
        <rect id="st_detect" x="400" y="500" width="200" height="60" class="state state-logic"/>
        <text x="500" y="530" class="state-text">HE_STALL_DETECT</text>

        <rect id="st_setref" x="400" y="610" width="200" height="60" class="state state-logic"/>
        <text x="500" y="640" class="state-text">HE_SETREF</text>

        <rect id="st_done" x="400" y="720" width="200" height="60" class="state state-ok"/>
        <text x="500" y="750" class="state-text">HE_DONE</text>

        <rect id="st_req_home" x="50" y="170" width="200" height="60" class="state state-fail"/>
        <text x="150" y="200" class="state-text">HE_REQUIRES_HOME</text>

        <rect id="st_error" x="750" y="445" width="200" height="60" class="state state-fail"/>
        <text x="850" y="475" class="state-text">ERROR</text>
    </g>

    <!-- Transitions -->
    <g id="transitions" marker-end="url(#arrow)" class="line">
        <!-- IDLE -> CHECK -->
        <line x1="500" y1="120" x2="500" y2="170" />
        <text x="500" y="145" class="transition-text">Execute</text>

        <!-- CHECK -> REQ_HOME -->
        <line x1="400" y1="200" x2="250" y2="200" />
        <text x="325" y="185" class="transition-text">AbsHomeRequired</text>
        
        <!-- CHECK -> FAST_APPROACH -->
        <line x1="500" y1="230" x2="500" y2="280" />
        <text x="520" y="255" class="transition-text">!AbsHomeRequired</text>
        
        <!-- FAST_APPROACH -> SLOW_APPROACH -->
        <line x1="500" y1="340" x2="500" y2="390" />
        <text x="500" y="365" class="transition-text">Near EOT</text>
        
        <!-- SLOW_APPROACH -> STALL_DETECT -->
        <line x1="500" y1="450" x2="500" y2="500" />
        <text x="500" y="475" class="transition-text">Stall Condition Met</text>
        
        <!-- STALL_DETECT -> SLOW_APPROACH (Reset) -->
        <path d="M 400 515 C 320 515, 320 435, 400 435" fill="none"/>
        <text x="320" y="475" class="transition-text">Stall Condition Lost</text>

        <!-- STALL_DETECT -> SETREF -->
        <line x1="500" y1="560" x2="500" y2="610" />
        <text x="500" y="585" class="transition-text">Stall Timer Done</text>

        <!-- SETREF -> DONE -->
        <line x1="500" y1="670" x2="500" y2="720" />
        <text x="500" y="695" class="transition-text">Halt.Done &amp; Offset Calc</text>

        <!-- DONE -> IDLE -->
        <path d="M 400 750 C 300 750, 300 100, 400 90" fill="none"/>
        <text x="320" y="420" class="transition-text">!Execute</text>

        <!-- To ERROR -->
        <path d="M 600 310 C 680 310, 720 390, 750 445" fill="none" stroke-dasharray="5, 3"/>
        <path d="M 600 420 C 650 420, 750 445, 750 445" fill="none" stroke-dasharray="5, 3"/>
        <path d="M 600 530 C 650 530, 750 505, 750 505" fill="none" stroke-dasharray="5, 3"/>
        <text x="700" y="380" class="transition-text">Timeout or Drive Error</text>
        
        <!-- ERROR -> IDLE -->
        <path d="M 850 505 C 850 650, 650 800, 500 780" fill="none"/>
        <path d="M 500 780 C 350 760, 150 600, 150 120 C 250 80, 350 80, 400 80" fill="none"/>
        <text x="250" y="500" class="transition-text">!Execute</text>

        <!-- To IDLE on Abort -->
        <path d="M 400 310 C 100 310, 100 100, 400 90" fill="none" stroke-dasharray="5, 3"/>
        <text x="200" y="190" class="transition-text">Abort</text>
    </g>
</svg>
