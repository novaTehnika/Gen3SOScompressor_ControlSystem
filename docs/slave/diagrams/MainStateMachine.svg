<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200px" height="1000px" viewBox="0 0 1200 1000">
    <style>
        .state { rx: 8; ry: 8; stroke: #333; stroke-width: 2; fill-opacity: 0.95; }
        .state-init { fill: #E3F2FD; } /* Light Blue */
        .state-idle { fill: #FCE4EC; } /* Light Pink */
        .state-active { fill: #E8F5E9; } /* Light Green */
        .state-homing { fill: #FFFDE7; } /* Light Yellow */
        .state-trans { fill: #F3E5F5; } /* Light Purple */
        .state-fault { fill: #FFEBEE; } /* Light Red */
        .state-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
        .transition-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; }
        .arrow-head { fill: #333; }
        .line { stroke: #333; stroke-width: 1.5; }
    </style>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
        </marker>
    </defs>

    <!-- States -->
    <g id="states">
        <!-- Init Group -->
        <rect id="st_init" x="50" y="50" width="180" height="60" class="state state-init"/>
        <text x="140" y="80" class="state-text">ST_INIT</text>
        <rect id="st_encoder_check" x="50" y="150" width="180" height="60" class="state state-init"/>
        <text x="140" y="180" class="state-text">ST_ENCODER_CHECK</text>
        <rect id="st_req_abs_home" x="50" y="250" width="180" height="60" class="state state-init"/>
        <text x="140" y="280" class="state-text">ST_REQUIRE_ABS_HOME</text>

        <!-- Idle State -->
        <rect id="st_idle" x="350" y="180" width="180" height="80" class="state state-idle"/>
        <text x="440" y="220" class="state-text">ST_IDLE</text>

        <!-- Activation Group -->
        <rect id="st_drive_enable" x="650" y="50" width="180" height="60" class="state state-trans"/>
        <text x="740" y="80" class="state-text">ST_DRIVE_ENABLE</text>
        <rect id="st_brake_release" x="650" y="150" width="180" height="60" class="state state-trans"/>
        <text x="740" y="180" class="state-text">ST_BRAKE_RELEASE</text>

        <!-- Deactivation Group -->
        <rect id="st_brake_engage" x="350" y="450" width="180" height="60" class="state state-trans"/>
        <text x="440" y="480" class="state-text">ST_BRAKE_ENGAGE</text>
        <rect id="st_drive_disable" x="350" y="550" width="180" height="60" class="state state-trans"/>
        <text x="440" y="580" class="state-text">ST_DRIVE_DISABLE</text>

        <!-- Operational Group -->
        <rect id="st_pos_ctrl" x="900" y="50" width="180" height="60" class="state state-active"/>
        <text x="990" y="80" class="state-text">ST_POSITION_CTRL</text>
        <rect id="st_vel_ctrl" x="900" y="130" width="180" height="60" class="state state-active"/>
        <text x="990" y="160" class="state-text">ST_VELOCITY_CTRL</text>
        <rect id="st_torque_ctrl" x="900" y="210" width="180" height="60" class="state state-active"/>
        <text x="990" y="240" class="state-text">ST_TORQUE_CTRL</text>
        <rect id="st_brake_hold" x="900" y="290" width="180" height="60" class="state state-active"/>
        <text x="990" y="320" class="state-text">ST_BRAKE_HOLD</text>

        <!-- Homing Group -->
        <rect id="st_go_home" x="900" y="400" width="180" height="60" class="state state-homing"/>
        <text x="990" y="430" class="state-text">ST_GO_HOME</text>
        <rect id="st_home_limit" x="900" y="480" width="180" height="60" class="state state-homing"/>
        <text x="990" y="510" class="state-text">ST_HOME_LIMIT</text>
        <rect id="st_home_eot" x="900" y="560" width="180" height="60" class="state state-homing"/>
        <text x="990" y="590" class="state-text">ST_HOME_EOT</text>
        <rect id="st_home_complete" x="650" y="520" width="180" height="60" class="state state-homing"/>
        <text x="740" y="550" class="state-text">ST_HOME_COMPLETE</text>


        <!-- Hold Position -->
        <rect id="st_hold_pos" x="650" y="320" width="180" height="60" class="state state-trans"/>
        <text x="740" y="350" class="state-text">ST_HOLD_POSITION</text>

        <!-- Fault Group -->
        <rect id="st_fault" x="350" y="750" width="180" height="60" class="state state-fault"/>
        <text x="440" y="780" class="state-text">ST_FAULT</text>
        <rect id="st_fault_idle" x="580" y="850" width="180" height="60" class="state state-fault"/>
        <text x="670" y="880" class="state-text">ST_FAULT_IDLE</text>
        <rect id="st_fault_recovery" x="120" y="850" width="180" height="60" class="state state-fault"/>
        <text x="210" y="880" class="state-text">ST_FAULT_RECOVERY</text>
    </g>

    <!-- Transitions -->
    <g id="transitions" marker-end="url(#arrow)" class="line">
        <!-- Init Flow -->
        <line x1="140" y1="110" x2="140" y2="150" />
        <line x1="140" y1="210" x2="140" y2="250" />
        <path d="M 230 180 C 280 180, 300 180, 350 200" fill="none"/>
        <text x="265" y="170" class="transition-text">Encoder OK</text>
        <path d="M 140 310 C 140 340, 250 340, 390 260" fill="none"/>
        <text x="240" y="325" class="transition-text">After setting flag</text>
        <path d="M 230 280 C 280 280, 300 250, 350 240" fill="none"/>
        <text x="240" y="255" class="transition-text">Encoder Invalid</text>
        
        <!-- Idle to Active -->
        <path d="M 530 220 C 580 220, 600 100, 650 80" fill="none"/>
        <text x="540" y="160" class="transition-text">Handshake OK &amp;</text>
        <text x="540" y="175" class="transition-text">Homing OK</text>

        <!-- Activation Flow -->
        <line x1="740" y1="110" x2="740" y2="150" />
        <text x="745" y="135" class="transition-text">Drive Ready</text>
        <path d="M 830 180 C 860 180, 880 100, 900 80" fill="none"/>
        <text x="835" y="140" class="transition-text">Target Mode</text>
        
        <!-- Operational to Hold -->
        <path d="M 900 80 C 860 80, 850 330, 830 350" fill="none"/>
        <path d="M 900 160 C 870 160, 850 330, 830 350" fill="none"/>
        <path d="M 900 240 C 870 240, 850 330, 830 350" fill="none"/>
        <text x="780" y="290" class="transition-text">MotionEnable drops</text>

        <!-- Hold to Operational -->
        <path d="M 650 350 C 600 350, 600 300, 650 200 C 680 150, 850 150, 900 150" fill="none" />
        <text x="600" y="260" class="transition-text">New Handshake OK</text>

        <!-- Hold to Deactivation -->
        <path d="M 650 380 C 600 400, 550 420, 530 470" fill="none" />
        <text x="570" y="420" class="transition-text">Mode = IDLE</text>
        
        <!-- Deactivation to Idle -->
        <line x1="440" y1="510" x2="440" y2="550" />
        <text x="445" y="535" class="transition-text">Brake Engaged</text>
        <path d="M 440 610 C 440 640, 340 640, 340 240 C 340 200, 350 200, 350 220" fill="none"/>
        <text x="260" y="450" class="transition-text">Drive Disabled</text>

        <!-- Brake Hold Transitions -->
        <path d="M 830 320 C 850 400, 850 480, 830 500 C 830 500, 600 500, 530 480" fill="none"/>
        <text x="690" y="470" class="transition-text">Mode = IDLE</text>
        <path d="M 900 300 C 870 250, 860 200, 830 180" fill="none"/>
        <text x="800" y="240" class="transition-text">New Mode requires</text>
        <text x="800" y="255" class="transition-text">brake release</text>

        <!-- Homing Flow -->
        <path d="M 830 540 C 850 560, 850 580, 830 580" fill="none"/>
        <text x="835" y="565" class="transition-text">Done</text>
        <line x1="830" y1="550" x2="830" y2="550"/>
        <line x1="900" y1="510" x2="830" y2="550"/>
        <line x1="900" y1="580" x2="830" y2="550"/>

        <!-- Homing Complete to Hold -->
        <path d="M 740 520 C 740 480, 740 420, 740 380" fill="none"/>
        <text x="745" y="450" class="transition-text">MotionEnable drops</text>

        <!-- To Fault State (Generic) -->
        <path d="M 1080 100 C 1150 100, 1150 800, 530 780" fill="none" stroke-dasharray="8, 4" />
        <path d="M 650 100 C 580 100, 580 720, 530 765" fill="none" stroke-dasharray="8, 4" />
        <path d="M 530 240 C 580 240, 580 720, 530 765" fill="none" stroke-dasharray="8, 4" />
        <text x="750" y="700" class="transition-text">Safety Monitor Trip OR Internal Error</text>
        <text x="750" y="715" class="transition-text">(from any active/transitional state)</text>

        <!-- Fault Recovery -->
        <path d="M 350 780 C 300 780, 250 800, 210 850" fill="none"/>
        <text x="200" y="800" class="transition-text">Legacy Path</text>
        <line x1="300" y1="880" x2="380" y2="810" />
        <text x="310" y="840" class="transition-text">Reset Done</text>
        <path d="M 350 795 C 200 795, 200 350, 400 260" fill="none"/>
        <text x="210" y="550" class="transition-text">"Fast Recovery":</text>
        <text x="210" y="565" class="transition-text">Reset Handshake OK</text>
        
        <path d="M 530 800 C 560 820, 580 840, 580 870" fill="none"/>
        <text x="500" y="830" class="transition-text">Timeout</text>
        
        <path d="M 760 880 C 850 880, 850 240, 530 240" fill="none"/>
        <text x="750" y="600" class="transition-text">Fault Reset Handshake OK</text>
    </g>
</svg>
