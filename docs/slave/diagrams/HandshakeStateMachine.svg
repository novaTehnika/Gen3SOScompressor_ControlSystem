<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800px" height="600px" viewBox="0 0 800 600">
    <style>
        .state { rx: 8; ry: 8; stroke: #333; stroke-width: 2; fill-opacity: 0.95; }
        .state-idle { fill: #FCE4EC; } /* Light Pink */
        .state-wait { fill: #E3F2FD; } /* Light Blue */
        .state-ok { fill: #E8F5E9; } /* Light Green */
        .state-fail { fill: #FFEBEE; } /* Light Red */
        .state-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
        .transition-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; text-anchor: middle; }
        .arrow-head { fill: #333; }
        .line { stroke: #333; stroke-width: 1.5; }
    </style>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
        </marker>
    </defs>

    <!-- States -->
    <g id="states">
        <rect id="st_idle" x="300" y="50" width="200" height="70" class="state state-idle"/>
        <text x="400" y="85" class="state-text">HS_IDLE</text>

        <rect id="st_wait" x="300" y="200" width="200" height="70" class="state state-wait"/>
        <text x="400" y="235" class="state-text">HS_WAIT_MOTION_EN</text>
        
        <rect id="st_verify" x="300" y="350" width="200" height="70" class="state state-wait"/>
        <text x="400" y="385" class="state-text">HS_VERIFY_MODE</text>

        <rect id="st_complete" x="50" y="350" width="200" height="70" class="state state-ok"/>
        <text x="150" y="385" class="state-text">HS_COMPLETE</text>

        <rect id="st_timeout" x="550" y="350" width="200" height="70" class="state state-fail"/>
        <text x="650" y="385" class="state-text">HS_TIMEOUT</text>
    </g>

    <!-- Transitions -->
    <g id="transitions" marker-end="url(#arrow)" class="line">
        <!-- IDLE -> WAIT -->
        <line x1="400" y1="120" x2="400" y2="200" />
        <text x="400" y="150" class="transition-text">ModeStable &amp;&amp; Mode != IDLE</text>
        <text x="400" y="165" class="transition-text">&amp;&amp; !MotionEnable</text>

        <!-- WAIT -> IDLE -->
        <path d="M 300 235 C 200 235, 200 100, 300 85" fill="none"/>
        <text x="220" y="170" class="transition-text">Mode changed</text>

        <!-- WAIT -> VERIFY -->
        <line x1="400" y1="270" x2="400" y2="350" />
        <text x="400" y="310" class="transition-text">MotionEnable == TRUE</text>
        
        <!-- WAIT -> TIMEOUT -->
        <path d="M 500 235 C 580 235, 620 300, 650 350" fill="none"/>
        <text x="590" y="280" class="transition-text">Timeout</text>

        <!-- VERIFY -> COMPLETE -->
        <line x1="300" y1="385" x2="250" y2="385" />
        <text x="275" y="370" class="transition-text">Mode OK</text>
        
        <!-- VERIFY -> TIMEOUT -->
        <line x1="500" y1="385" x2="550" y2="385" />
        <text x="525" y="370" class="transition-text">Mode Mismatch</text>

        <!-- COMPLETE -> IDLE -->
        <path d="M 150 350 C 150 250, 250 150, 350 120" fill="none"/>
        <text x="210" y="240" class="transition-text">!MotionEnable</text>
        
        <!-- TIMEOUT -> IDLE -->
        <path d="M 650 350 C 650 250, 550 150, 450 120" fill="none"/>
        <text x="590" y="240" class="transition-text">!MotionEnable</text>
    </g>
</svg>
